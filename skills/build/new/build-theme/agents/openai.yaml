interface:
  display_name: "Build Theme"
  short_description: "Build nền theme, section và block theo contract."
  default_prompt: "Dùng $build-theme để xây hoặc cập nhật implementation theme theo foundation và contract của repo đích. Khi cần Figma, áp dụng contract figma-access của theme-style-guide: dùng MCP trước, chờ Accept nếu cần; hết quota thì tự dùng CUA kiểm tra đúng link trên Chrome đang mở, xác minh profile minhle@beae.com theo contract chung. Khi dùng Chrome, theo contract browser-session: ghi checkpoint tab/group của task, dùng lại sau khôi phục ngữ cảnh và cleanup khi hoàn tất. Theo contract task-artifacts: loại output/test tạm khỏi commit và dọn delta do task tạo khi hoàn tất, giữ thay đổi có sẵn và hồ sơ được yêu cầu lưu."
