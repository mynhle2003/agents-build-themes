interface:
  display_name: "Theme Style Guide"
  short_description: "Config Figma với token, range và runtime mapping hiện có."
  default_prompt: "Dùng $theme-style-guide để ánh xạ style guide Figma vào Theme Settings hiện có, đọc contract chung; thu thập đủ consumer trước chỉnh scale token; Font weight: Heading theo Heading, Body theo Body/16, Accent theo Eyebrow, chọn đúng biến thể font picker theo contract chung; Heading tracking riêng từng cấp, Button/Badge weight riêng và font variant theo mục1.2; bỏ qua Heading tablet; spacing Tailwind mặc định1=4px; thiếu hover tạo từ màu gốc, contrast4.5:1; lấy tracking Body/16 vào --font-body-letter-spacing qua scale chung, Đọc gap sale/compare-at từ Figma để gắn --compare-at-price-spacing; Đọc card Figma desktop/mobile để config layout nhóm Product cards theo contract chung, phân biệt media–content/content gap/details gap, resolve spacing variables ra px và kiểm tra consumer global; Price kế thừa tracking và giữ font/size riêng, cho phép căn chỉnh range/runtime mapping hiện hữu, khi thiếu option được custom color/font-size/opacity của .price__compare-at hiện hữu theo Figma và audit scope theo ngoại lệ contract; hỏi trước khi thêm select value hoặc CSS token; chỉ thêm/migrate bộ control Typography đã duyệt ở mục1.2, giữ composition ngoài phạm vi. Khi cần Figma, áp dụng contract figma-access của theme-style-guide: dùng MCP trước, chờ Accept nếu cần; hết quota thì tự dùng CUA kiểm tra đúng link trên Chrome đang mở, xác minh profile minhle@beae.com theo contract chung."
