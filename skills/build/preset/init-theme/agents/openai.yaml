interface:
  display_name: "Init Theme"
  short_description: "Khởi tạo theme mới hoặc biến thể từ Figma theo checkpoint"
  default_prompt: "Dùng $init-theme; hỏi rõ theme mới hay biến thể nếu chưa chọn. Khi có worktree và link Figma, tạo docs/qa/homepage-qa.md (tái sử dụng check-perfect-homepage.md nếu đã có), mỗi section một file QA ổn định gộp các lượt kiểm tra/fix theo contract qa-section/references/qa-report-files.md để lưu nguồn, mẫu định dạng Sheet và checkpoint; style còn nháp thì theo dõi trong sheet-style-tracker.md, chưa render cuối trước khi người dùng chốt. Cả hai mode kiểm tra layout desktop/mobile với preset/instance hiện có, tái sử dụng phần phù hợp và chỉ chỉnh delta, không reset toàn bộ template. Theme mới áp dụng contract chung của theme-style-guide: được căn chỉnh token/range/runtime mapping hiện hữu; Font weight: Heading theo Heading, Body theo Body/16, Accent theo Eyebrow, chọn đúng biến thể font picker theo contract chung; Heading tracking riêng từng cấp, Button/Badge weight riêng và font variant theo mục1.2; bỏ qua Heading tablet; spacing Tailwind mặc định1=4px; thiếu hover tạo từ màu gốc, contrast4.5:1; lấy tracking Body/16 vào --font-body-letter-spacing qua scale chung, Đọc gap sale/compare-at từ Figma để gắn --compare-at-price-spacing; Đọc card Figma desktop/mobile để config layout nhóm Product cards theo contract chung, phân biệt media–content/content gap/details gap, resolve spacing variables ra px và kiểm tra consumer global; kiểm tra Price kế thừa tracking và giữ font/size riêng, khi thiếu option được custom color/font-size/opacity của .price__compare-at hiện hữu theo Figma và audit scope theo ngoại lệ contract; hỏi trước phần select value/token ngoài bộ control Typography đã duyệt ở mục1.2; sau đó build tuần tự; biến thể hỏi hai link Figma homepage desktop/mobile, không hỏi Style Guide, tạo branch/worktree từ code mới nhất của theme nguồn, kế thừa nguyên settings/preset/logic, không đọc lại Style Guide, ghi checkpoint cập nhật hai chiều rồi phát triển phần được yêu cầu. Khi cần Figma, áp dụng contract figma-access của theme-style-guide: dùng MCP trước, chờ Accept nếu cần; hết quota thì tự dùng CUA kiểm tra đúng link trên Chrome đang mở, xác minh profile minhle@beae.com theo contract chung. Khi dùng Chrome, theo contract browser-session: ghi checkpoint tab/group của task, dùng lại sau khôi phục ngữ cảnh và cleanup khi hoàn tất. Theo contract task-artifacts: loại output/test tạm khỏi commit và dọn delta do task tạo khi hoàn tất, giữ thay đổi có sẵn và hồ sơ được yêu cầu lưu."
