interface:
  display_name: "Init Theme"
  short_description: "Khởi tạo theme mới hoặc biến thể từ Figma theo checkpoint"
  default_prompt: "Dùng $init-theme; hỏi rõ theme mới hay biến thể nếu chưa chọn. Theme mới áp dụng Style Guide rồi build tuần tự; biến thể hỏi hai link Figma homepage desktop/mobile, không hỏi Style Guide, tạo branch/worktree từ code mới nhất của theme nguồn, kế thừa nguyên settings/preset/logic, không đọc lại Style Guide, ghi checkpoint cập nhật hai chiều rồi phát triển phần được yêu cầu."
