interface:
  display_name: "Shopify Block Animation Presets"
  short_description: "Set existing animation presets using industry references"
  default_prompt: "Use $shopify-block-animation-presets to research 5–6 popular Shopify themes in this industry and configure supported animation presets across blocks, sections, and templates without changing implementation code. Khi dùng Chrome, theo contract browser-session: ghi checkpoint tab/group của task, dùng lại sau khôi phục ngữ cảnh và cleanup khi hoàn tất. Theo contract task-artifacts: loại output/test tạm khỏi commit và dọn delta do task tạo khi hoàn tất, giữ thay đổi có sẵn và hồ sơ được yêu cầu lưu."
