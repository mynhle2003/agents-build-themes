interface:
  display_name: "Build Preset"
  short_description: "Cấu hình preset và Theme Settings từ Figma bằng control hiện có."
  default_prompt: "Dùng $build-preset để cấu hình preset/template và current trong config/settings_data.json local từ Figma bằng setting ID hiện có, giữ nguyên saved presets và kiểm tra ảnh hưởng toàn theme; cấu hình composition bằng section và block hiện có; media dùng URL/reference hoặc handle từ store, không sửa preset trên store khi chưa được cho phép rõ ràng. Với section/block có hotspot, đọc references/hotspots.md, đo tâm chấm và đối chiếu crop trên web desktop/mobile; focal point thuộc media store. Giữ tên section gốc cho preset Figma hiện tại, không thêm tiền tố theme/số thứ tự; chỉ giữ tên riêng khi được yêu cầu. Tên có (custom) dùng Custom section và đăng ký preset trong Add section của template đích. Font weight: Heading theo Heading, Body theo Body/16, Accent theo Eyebrow, chọn đúng biến thể font picker theo contract chung; Heading tracking riêng từng cấp, Button/Badge weight riêng và font variant theo mục1.2; bỏ qua Heading tablet; spacing Tailwind mặc định1=4px; thiếu hover tạo từ màu gốc, contrast4.5:1; Đọc gap sale/compare-at từ Figma để gắn --compare-at-price-spacing; Price dùng option hiện có và kế thừa tracking Body/16 qua --font-body-letter-spacing; không hardcode CSS giá. Gỡ override Price cũ chặn control/kế thừa theo contract, giữ logic giá; thiếu control báo gap, thêm value/token phải hỏi. Báo các chênh lệch còn lại. Khi cần Figma, áp dụng contract figma-access của theme-style-guide: dùng MCP trước, chờ Accept nếu cần; hết quota thì tự dùng CUA kiểm tra đúng link trên Chrome đang mở, xác minh profile minhle@beae.com theo contract chung."
