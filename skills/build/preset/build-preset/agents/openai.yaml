  default_prompt: "Dùng $build-preset để cấu hình preset/template trong file local từ Figma bằng section và block hiện có; media dùng URL/reference hoặc handle từ store, không sửa preset trên store khi chưa được cho phép rõ ràng, rồi báo các chênh lệch còn lại."
