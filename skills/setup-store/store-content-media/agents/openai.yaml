interface:
  display_name: "Store Content & Media"
  short_description: "Tạo và cập nhật product, content, ảnh và video."
  default_prompt: "Dùng $store-content-media để tạo hoặc cập nhật product, collection, blog và media trong store đích đã xác định; nếu cần gắn preset/template thì chỉ sửa file local bằng URL/reference hoặc handle, không sửa preset trên store khi chưa được cho phép rõ ràng. Với media section/block có hotspot, đọc reference hotspot dùng chung, lưu focal point mặc định 50% 50% tại Shopify media trong phạm vi yêu cầu, xác minh crop và điểm neo trên web desktop/mobile. Khi cần Figma, áp dụng contract figma-access của theme-style-guide: dùng MCP trước, chờ Accept nếu cần; hết quota thì tự dùng CUA kiểm tra đúng link trên Chrome đang mở, xác minh profile minhle@beae.com theo contract chung."
