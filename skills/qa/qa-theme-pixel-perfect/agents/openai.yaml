interface:
  display_name: "QA Theme Pixel Perfect"
  short_description: "Kiểm từng thành phần, báo cáo Sheet gọn theo section"
  default_prompt: "Dùng $qa-theme-pixel-perfect đọc hồ sơ QA do init-theme lưu để lấy nguồn và mẫu báo cáo, theo dõi style nháp đến khi người dùng chốt; quét đủ/thiếu thành phần và bố cục từng section theo Figma, kiểm nội dung/typo/màu/kích thước theo từng block trên desktop/mobile, áp dụng ngoại lệ mobile next-item preview rồi nhóm theo cây thành phần thực tế trong Google Sheet tiếng Việt 8 cột không có link: nội dung đối chiếu ngắn gọn, mỗi lỗi chưa khớp có một dòng hướng xử lý tương ứng, gộp ô thành phần cạnh các dòng tiêu chí, dropdown trạng thái có màu, STT riêng và tên section tiếng Anh; chỉ QA, không tự sửa theme. Khi dùng Chrome, theo contract browser-session: ghi checkpoint tab/group của task, dùng lại sau khôi phục ngữ cảnh và cleanup khi hoàn tất. Mỗi section của page một file QA ổn định; kết quả mới nhất ở đầu, gộp lịch sử các lượt QA/fix vào cùng file theo contract qa-section/references/qa-report-files.md. Theo contract task-artifacts: loại output/test tạm khỏi commit và dọn delta do task tạo khi hoàn tất, giữ thay đổi có sẵn và hồ sơ được yêu cầu lưu."
